unbind r
bind r source-file ~/.config/tmux/tmux.conf

# set new prefix
unbind C-b
set -g prefix C-s
bind  C-s send-prefix

unbind c
bind c new-window -c "#{pane_current_path}"

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-overrides ",*:bce@"


set -g status-style "bg=default,fg=white"
set -g status-position top
set -g window-status-current-style "fg=black,bg=blue,bold"
# set -g message-style "bg=blue,fg=black"
# set -g message-command-style "bg=blue,fg=black"

# status left
set -g allow-rename off
set -g status-interval 5
set -g status-left-length 100

# status right
set -g status-right-length 100
set -g status-right ""
set -ga status-right "#[fg=black,bg=blue] 󰭦 %Y-%m-%d 󰅐 %H:%M #[fg=blue,bg=default] #(~/.config/tmux/shortpath.sh #{pane_current_path} 30) #[default]"

### general config
# start index at 1
set -g base-index 1
set -g pane-base-index 1

# renumber when window is closed
set -g renumber-window on
