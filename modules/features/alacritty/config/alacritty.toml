[env]
TERM = "xterm-256color"

[window.padding]
x = 12
y = 12

[font]
size = 12

[font.normal]
family = "CaskaydiaMono Nerd Font"

[font.bold]
family = "CaskaydiaMono Nerd Font"

[font.italic]
family = "CaskaydiaMono Nerd Font"

[font.bold_italic]
family = "CaskaydiaMono Nerd Font"

# catppuccin-mocha
[colors.primary]
background = "#1e1e2e" # base
foreground = "#cdd6f4" # text
dim_foreground = "#7f849c" # overlay 1
bright_foreground = "#cdd6f4" # text

[colors.cursor]
text = "#1e1e2e" # base
cursor = "#f5e0dc" # rosewater

[colors.vi_mode_cursor]
text = "#1e1e2e" # base
cursor = "#b4befe" # lavender

[colors.search.matches]
foreground = "#1e1e2e" # base
background = "#a6adc8" # subtext 0

[colors.search.focused_match]
foreground = "#1e1e2e" # base
background = "#a6e3a1" # green

[colors.footer_bar]
foreground = "#1e1e2e" # base
background = "#a6adc8" # subtext 0

[colors.hints.start]
foreground = "#1e1e2e" # base
background = "#f9e2af" # yellow

[colors.hints.end]
foreground = "#1e1e2e" # base
background = "#a6adc8" # subtext 0

[colors.selection]
text = "#1e1e2e" # base
background = "#f5e0dc" # rosewater

[colors.normal]
black = "#45475a" # surface 1
red = "#f38ba8" # red
green = "#a6e3a1" # green
yellow = "#f9e2af" # yellow
blue = "#89b4fa" # blue
magenta = "#cba6f7" # mauve
cyan = "#74c7ec" # sapphire
white = "#bac2de" # subtext 1

[colors.bright]
black = "#585b70" # surface 2
red = "#eba0ac" # maroon
green = "#a6e3a1" # green
yellow = "#f9e2af" # yellow
blue = "#89b4fa" # blue
magenta = "#f5c2e7" # magenta
cyan = "#94e2d5" # teal
white = "#a6adc8" # a6adc8

[[colors.indexed_colors]]
index = 16
color = "#fab387" # peach

[[colors.indexed_colors]]
index = 17
color = "#f5e0dc" # rosewater

