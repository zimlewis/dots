[metadata]
name = "vis-files"
description = "A channel to select files to intergrate with vis"
requirements = ["fd", "bat"]

[source]
command = [
  { name = "Default", run = "fd -t f" },
  { name = "Hidden",  run = "fd -t f -H" },
]

[preview]
command = "bat -n --color=always '{}'"
env = { BAT_THEME = "ansi" }
